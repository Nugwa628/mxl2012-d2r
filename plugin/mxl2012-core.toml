# D2R-XL 2012 core plugin settings. D2RLoader writes this file once from the plugin's copy; your changes stay.

[mapreveal]
# Options > Controls: "Reveal Level Map" (default L) reveals the current level's map, in any level, whenever you press it.
# (The explored share it needed in 0.1.15 / 0.1.16 is gone: an old `threshold = ...` line here is ignored.)
# Level ids where the key reveals nothing, e.g. exclude = [73, 74]
exclude = []

[fonts]
# Clearer legacy (classic graphics) fonts: thinner digits and letters in panels, item text and titles. Dialogue, quest and
# chat text stay D2R's. Options > Controls: "Clear Legacy Fonts" (default Ctrl+F) switches it in game and saves it here;
# it takes effect at once. English (Latin) text only; HD text is not affected.
legacy_clear_fonts = false
