name: Crash or freeze
description: The game closed, froze, or showed an error dialog.
labels: ["crash", "needs-repro"]
body:
  - type: markdown
    attributes:
      value: |
        Crashes are the highest priority. The D2RLoader log and, if present, the crash dump folder are what we need most.
        Do not attach Blizzard game files.
  - type: input
    id: mod_version
    attributes:
      label: Mod version
      description: Type `mxl` in the in-game console, or read it from the release name.
    validations:
      required: true
  - type: input
    id: d2r_build
    attributes:
      label: D2R build
      placeholder: "93847"
    validations:
      required: true
  - type: input
    id: d2rloader_version
    attributes:
      label: D2RLoader version
      placeholder: "1.3.1"
    validations:
      required: true
  - type: input
    id: launcher_version
    attributes:
      label: Downloader version
      description: Leave empty if you did not use the downloader (or the old launcher).
  - type: dropdown
    id: install_method
    attributes:
      label: Install method
      options:
        - D2R-XL 2012 Downloader
        - Manual 7z
    validations:
      required: true
  - type: textarea
    id: when
    attributes:
      label: What were you doing when it crashed?
      description: Area, difficulty, what you had just done (killed a monster, opened a panel, picked up an item, changed area, saved and exited).
    validations:
      required: true
  - type: dropdown
    id: reproducible
    attributes:
      label: Does it happen every time?
      options:
        - Every time
        - Sometimes
        - Once
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: textarea
    id: log
    attributes:
      label: D2RLoader log
      description: Drag in `d2rloader/logs/d2rloader.log` right after the crash, before starting the game again. Also attach the newest folder in `d2rloader/crashes` if it exists.
    validations:
      required: true
  - type: textarea
    id: save
    attributes:
      label: Save file (optional)
      description: A zip of the character's files (`.d2s`, `.d2i`, `.d2rl`) from the `mxl2012` save folder, if the crash repeats with that character. Remove other characters first.
