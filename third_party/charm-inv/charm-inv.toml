# Charm-Inv
# Adds a separate inventory for charms.
#
# D2R-XL 2012: Median XL 2012's charms work from the normal inventory, so they keep working there and also work from the
# Charm Inventory (owner decision 2026-11-10). CharmInv's own default is false (only charms in CharmInv grant bonuses).

[charm-inv]
# Let charms in the normal inventory grant bonuses too.
# When false, only charms stored in CharmInv grant their bonuses.
allow_inventory_charms = true

# Tint charms whose bonuses are inactive.
# Supported values: "red", "green", "blue", "yellow", and "pale_red".
inactive_charm_tint = "yellow"

# Add a CharmInv button to the player inventory.
# Set false if the active mod adds its own button.
inject_inventory_button = true
